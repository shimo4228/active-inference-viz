[project]
name = "active-inference-viz"
version = "0.1.0"
description = "Interactive dashboard for visualizing active inference in embodied decision-making"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "plotly>=6.5.2",
    "scipy>=1.17.1",
    "streamlit>=1.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 99

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
]
